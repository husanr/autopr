name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  extension:
    name: Extension · manifest & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest.json
        run: |
          node -e "const m=require('./extension/manifest.json'); if (m.manifest_version !== 3) process.exit(1); console.log('✅ manifest v' + m.manifest_version + ' OK:', m.name, m.version)"
      - name: Syntax check JS
        run: |
          for f in extension/background.js extension/content.js extension/popup.js; do
            node --check "$f" && echo "✅ OK: $f"
          done